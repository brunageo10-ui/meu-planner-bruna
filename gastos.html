<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<title>Meus Gastos — Bruna</title>
<style>
:root{--w:#8a1238;--w2:#42101f;--bg:#fbf5ef;--ink:#21181b;--mut:#7f7273;--line:#eadbd2;--rose:#f9e4ea;--green:#147447;--red:#a7113e;--gold:#fff3c4;--sh:0 9px 22px rgba(82,44,37,.07)}
*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:radial-gradient(circle at 10% -10%,#fffaf6,#fff7f1 35%,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}main{width:100%;max-width:780px;margin:0 auto;padding:28px 18px 32px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 0 14px}.hello h1{font-family:Georgia,serif;margin:0;color:var(--w2);font-size:28px;line-height:1}.hello p{margin:7px 0 0;color:var(--mut);font-size:14px}.round{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fffdfb;color:var(--w);box-shadow:var(--sh);text-decoration:none;font-weight:900}.panel,.card,.item{background:linear-gradient(145deg,#fffefe,#fff8f3);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);overflow:hidden}.panel{padding:14px;margin:12px 0}.title{font-weight:900;font-size:19px;margin:0 0 10px;color:#22171a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--mut);font-weight:800}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 12px;outline:0;color:var(--ink)}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.typeBtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 12px;color:var(--w);font-weight:900}.typeBtn.on.expense{background:var(--rose);border-color:#edcbd4}.typeBtn.on.income{background:#e4f7ed;border-color:#bce8cf;color:var(--green)}.primary{width:100%;border:0;border-radius:17px;padding:14px 12px;background:linear-gradient(135deg,var(--w),#aa1746);color:#fff;font-weight:900;box-shadow:0 10px 22px rgba(138,18,56,.21);margin-top:10px}.ghost{border:0;border-radius:999px;padding:10px 13px;background:var(--rose);color:var(--w);font-weight:850}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{padding:12px 8px;text-align:center;min-height:76px;display:flex;flex-direction:column;justify-content:center}.card small{display:block;color:var(--mut);font-size:12px}.card b{display:block;font-size:20px;color:var(--w);margin-top:4px}.card.in b{color:var(--green)}.card.out b{color:var(--red)}.monthLine{display:flex;gap:8px;align-items:center;margin:7px 0 4px}.monthLine input{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 12px;outline:0}.list{margin-top:12px}.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--mut);font-weight:700}.item{position:relative;margin:10px 0;padding:13px 52px 13px 13px;background:#fffdfb}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.desc{font-weight:850;font-size:17px;line-height:1.15}.amount{font-weight:900;white-space:nowrap}.amount.in{color:var(--green)}.amount.out{color:var(--red)}.meta{margin-top:8px;color:var(--mut);font-size:12px;display:flex;gap:6px;flex-wrap:wrap}.tag{display:inline-flex;border-radius:999px;background:#f8dfe7;color:var(--w);padding:4px 9px;font-weight:800}.tag.income{background:#e4f7ed;color:var(--green)}.del{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:#f3e4e2;color:var(--w);font-weight:900;font-size:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.note{color:var(--mut);font-size:12px;margin:8px 2px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 16px;border-radius:16px;display:none;max-width:90%;z-index:99}.toast.show{display:block}@media(max-width:390px){main{padding-left:16px;padding-right:14px}.hello h1{font-size:25px}.grid{grid-template-columns:1fr}.stats{gap:7px}.card b{font-size:18px}.desc{font-size:16px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="hello"><h1>Meus gastos 💰</h1><p>Registre entradas, saídas e acompanhe o saldo do mês.</p></div>
    <a class="round" href="./index.html" aria-label="Voltar ao planner">⌂</a>
  </div>

  <section class="panel">
    <div class="title">Adicionar lançamento</div>
    <div class="types">
      <button type="button" class="typeBtn expense on" id="expenseBtn">💸 Gasto</button>
      <button type="button" class="typeBtn income" id="incomeBtn">💵 Recebimento</button>
    </div>
    <div class="grid">
      <div class="field"><label>Valor</label><input id="amount" inputmode="decimal" placeholder="Ex.: 35,00"></div>
      <div class="field"><label>Data</label><input id="date" type="date"></div>
    </div>
    <div class="field"><label>Descrição</label><input id="desc" placeholder="Ex.: mercado, gasolina, café, passeio"></div>
    <div class="grid">
      <div class="field"><label>Categoria</label><select id="category">
        <option>Pessoal</option><option>Casa</option><option>Mercado</option><option>Transporte</option><option>Escola</option><option>Saúde</option><option>SGS Vinho & Café</option><option>Experiências</option><option>Outro</option>
      </select></div>
      <div class="field"><label>Forma</label><select id="method"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Boleto</option><option>Outro</option></select></div>
    </div>
    <button class="primary" id="save">Salvar lançamento</button>
    <div class="note">Os dados ficam salvos somente no seu app/celular.</div>
  </section>

  <section class="panel">
    <div class="title">Resumo do mês</div>
    <div class="monthLine"><input id="month" type="month"><button class="ghost" id="thisMonth">Este mês</button></div>
    <div class="stats">
      <div class="card in"><small>Recebido</small><b id="totalIn">R$ 0,00</b></div>
      <div class="card out"><small>Gasto</small><b id="totalOut">R$ 0,00</b></div>
      <div class="card"><small>Saldo</small><b id="balance">R$ 0,00</b></div>
    </div>
    <div class="toolbar"><button class="ghost" id="exportJson">Backup</button><button class="ghost" id="exportCsv">CSV</button><button class="ghost" id="clearForm">Limpar campos</button></div>
  </section>

  <section class="panel">
    <div class="title">Lançamentos</div>
    <div id="list" class="list"></div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script>
'use strict';
const KEY='brunaExpensesV1';
let currentType='expense';
const $=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d=today()){return d.slice(0,7)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function parseMoney(v){v=String(v||'').trim().replace(/R\$|\s/g,''); if(!v)return NaN; if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.'); else v=v.replace(',','.'); return Number(v)}
function setType(t){currentType=t;$('expenseBtn').classList.toggle('on',t==='expense');$('incomeBtn').classList.toggle('on',t==='income')}
function add(){
  const amount=parseMoney($('amount').value);
  const desc=$('desc').value.trim();
  const date=$('date').value||today();
  if(!amount||amount<=0){toast('Digite um valor.');return}
  if(!desc){toast('Digite uma descrição.');return}
  const item={id:Date.now(),type:currentType,amount,desc,date,category:$('category').value,method:$('method').value,createdAt:new Date().toISOString()};
  const data=load();data.unshift(item);save(data);
  $('amount').value='';$('desc').value='';$('date').value=today();
  render();toast(currentType==='income'?'Recebimento salvo.':'Gasto salvo.');
}
function del(id){if(!confirm('Apagar este lançamento?'))return;save(load().filter(x=>x.id!==id));render();toast('Lançamento apagado.')}
function render(){
  const m=$('month').value||monthKey();
  const data=load().filter(x=>(x.date||'').slice(0,7)===m);
  const totalIn=data.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
  const totalOut=data.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
  $('totalIn').textContent=fmt.format(totalIn);$('totalOut').textContent=fmt.format(totalOut);$('balance').textContent=fmt.format(totalIn-totalOut);
  const list=$('list');
  if(!data.length){list.innerHTML='<div class="empty">Nenhum lançamento neste mês ainda 🌿</div>';return}
  list.innerHTML=data.sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.id-a.id).map(x=>{
    const sign=x.type==='income'?'+':'−';
    const cls=x.type==='income'?'in':'out';
    const label=x.type==='income'?'Recebimento':'Gasto';
    const date=(x.date||'').split('-').reverse().join('/');
    return `<div class="item"><button class="del" onclick="del(${x.id})">×</button><div class="row"><div class="desc">${escapeHtml(x.desc)}</div><div class="amount ${cls}">${sign} ${fmt.format(Number(x.amount||0))}</div></div><div class="meta"><span class="tag ${x.type==='income'?'income':''}">${label}</span><span class="tag">${escapeHtml(x.category||'Outro')}</span><span>${date}</span><span>${escapeHtml(x.method||'')}</span></div></div>`
  }).join('');
}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function exportJson(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});download(blob,'meus-gastos-backup.json')}
function exportCsv(){
  const rows=[['tipo','valor','descricao','categoria','forma','data']].concat(load().map(x=>[x.type,x.amount,x.desc,x.category,x.method,x.date]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'meus-gastos.csv')
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('expenseBtn').onclick=()=>setType('expense');$('incomeBtn').onclick=()=>setType('income');$('save').onclick=add;$('month').onchange=render;$('thisMonth').onclick=()=>{$('month').value=monthKey();render()};$('clearForm').onclick=()=>{$('amount').value='';$('desc').value='';$('date').value=today();toast('Campos limpos.')};$('exportJson').onclick=exportJson;$('exportCsv').onclick=exportCsv;
$('date').value=today();$('month').value=monthKey();render();
</script>
</body>
</html>
