<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a1238">
<title>Meus Gastos — Bruna</title>
<style>
:root{--w:#8a1238;--w2:#42101f;--bg:#fbf5ef;--ink:#21181b;--mut:#7f7273;--line:#eadbd2;--rose:#f9e4ea;--green:#167a4a;--red:#a51635;--sh:0 9px 22px rgba(82,44,37,.07)}
*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:radial-gradient(circle at 10% -10%,#fffaf6,#fff7f1 35%,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}main{width:100%;max-width:780px;margin:0 auto;padding:28px 18px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 14px}.hello h1{font-family:Georgia,serif;margin:0;color:var(--w2);font-size:28px;line-height:1}.hello p{margin:6px 0 0;color:var(--mut);font-size:14px}.round{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fffdfb;color:var(--w);box-shadow:var(--sh)}.card,.item{background:linear-gradient(145deg,#fffefe,#fff8f3);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);overflow:hidden}.card{padding:14px;margin:12px 0}.title{font-weight:900;color:var(--w2);font-size:18px;margin:0 0 10px}.quick{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px;margin-bottom:9px}.quick input{width:100%;border:0;outline:0;background:transparent;font-size:17px}.hint{font-size:12px;color:var(--mut);line-height:1.35;margin:8px 2px}.actions{display:grid;grid-template-columns:.7fr 1fr;gap:9px}.btn{border:0;border-radius:16px;padding:12px 10px;font-weight:900;background:var(--rose);color:var(--w)}.primary{background:linear-gradient(135deg,var(--w),#aa1746);color:#fff;box-shadow:0 10px 22px rgba(138,18,56,.21)}.green{background:#e1f6eb;color:var(--green)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:8px 0}.field label{display:block;font-size:12px;color:var(--mut);font-weight:800;margin:0 0 4px 2px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px;outline:0;color:var(--ink)}.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.toggle button{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:15px;padding:11px;font-weight:900}.toggle button.on[data-type="saida"]{background:#ffe9ee;color:var(--red);border-color:#f1c6cf}.toggle button.on[data-type="entrada"]{background:#e3f8ed;color:var(--green);border-color:#bde8cf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--sh);font-size:12px;color:var(--mut)}.stat b{display:block;font-size:19px;color:var(--w);line-height:1.15}.stat .in{color:var(--green)}.stat .out{color:var(--red)}.item{padding:12px;margin:9px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#fffdfb}.itemText{font-weight:850;font-size:16px}.meta{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.35}.money{font-weight:950;font-size:16px;white-space:nowrap}.money.in{color:var(--green)}.money.out{color:var(--red)}.del{border:0;border-radius:50%;width:32px;height:32px;background:#f3e4e2;color:var(--w);font-weight:900}.listHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}.listHead h2{font-size:22px;margin:0}.small{border:0;border-radius:999px;background:var(--rose);color:var(--w);font-weight:900;padding:9px 12px}.empty{padding:14px;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--mut);text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 16px;border-radius:16px;display:none;max-width:90%;z-index:99}@media(max-width:390px){main{padding-left:16px;padding-right:14px}.row,.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.hello h1{font-size:25px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="hello"><h1>Meus gastos 💰</h1><p>Controle simples do dinheiro que entra e sai.</p></div>
    <button class="round" onclick="location.href='index.html'">⌂</button>
  </div>

  <section class="card">
    <div class="title">Lançamento rápido</div>
    <div class="quick"><span>✎</span><input id="quickText" placeholder="Ex.: 150 gasolina, recebi 250 passeio, entrou 1500 salário"></div>
    <div class="actions"><button class="btn" id="voiceBtn">🎙️ Falar</button><button class="btn primary" id="quickBtn">✨ Organizar</button></div>
    <div class="hint">Para dinheiro que entra, use palavras como <b>recebi</b>, <b>recebido</b>, <b>entrou</b>, <b>entrada</b>, <b>ganhei</b> ou <b>salário</b>.</div>
  </section>

  <section class="card">
    <div class="title">Adicionar manualmente</div>
    <div class="toggle"><button id="saidaBtn" data-type="saida" class="on">💸 Gasto</button><button id="entradaBtn" data-type="entrada">💰 Entrada</button></div>
    <div class="row"><div class="field"><label>Valor</label><input id="valor" inputmode="decimal" placeholder="R$ 0,00"></div><div class="field"><label>Data</label><input id="data" type="date"></div></div>
    <div class="field"><label>Descrição</label><input id="desc" placeholder="Gasolina, mercado, cliente, salário..."></div>
    <div class="row"><div class="field"><label>Categoria</label><select id="cat"><option>Casa</option><option>Alimentação</option><option>Transporte</option><option>Escola</option><option>SGS Vinho & Café</option><option>Saúde</option><option>Lazer</option><option>Recebimentos</option><option>Outros</option></select></div><div class="field"><label>Forma</label><select id="forma"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Outro</option></select></div></div>
    <button class="btn primary" id="addBtn" style="width:100%;margin-top:8px">Salvar lançamento</button>
  </section>

  <section class="card">
    <div class="title">Resumo do mês</div>
    <div class="stats"><div class="stat">Entradas<b class="in" id="totalIn">R$ 0,00</b></div><div class="stat">Gastos<b class="out" id="totalOut">R$ 0,00</b></div><div class="stat">Saldo<b id="saldo">R$ 0,00</b></div></div>
  </section>

  <div class="listHead"><h2>Lançamentos</h2><div><button class="small" id="csvBtn">CSV</button> <button class="small" id="backupBtn">Backup</button></div></div>
  <div id="list"></div>
</main>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='brunaGastosLancamentos';
let tipo='saida';
let items=load();
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
$('data').value=today();
function money(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>t.style.display='none',2400)}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(a))return a;const b=JSON.parse(localStorage.getItem('brunaGastos')||'[]');return Array.isArray(b)?b:[]}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem('brunaGastos',JSON.stringify(items))}
function setTipo(t){tipo=t;$('saidaBtn').classList.toggle('on',t==='saida');$('entradaBtn').classList.toggle('on',t==='entrada')}
$('saidaBtn').onclick=()=>setTipo('saida');$('entradaBtn').onclick=()=>setTipo('entrada');
function parseValor(s){s=String(s||'').replace(/r\$|reais|real/gi,' ');let m=s.match(/(?:^|\s)(\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:[,.]\d{1,2})?)(?:\s|$)/);if(!m)return 0;return Number(m[1].replace(/\./g,'').replace(',','.'))||0}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function inferTipo(s){const n=norm(s);return /\b(recebi|recebido|recebida|entrada|entrou|ganhei|ganho|salario|pix recebido|cliente pagou|pagamento recebido)\b/.test(n)?'entrada':'saida'}
function inferForma(s){const n=norm(s);if(/pix/.test(n))return 'Pix';if(/credito|cartao/.test(n))return 'Crédito';if(/debito/.test(n))return 'Débito';if(/dinheiro|especie/.test(n))return 'Dinheiro';return 'Pix'}
function inferCat(s,t){const n=norm(s);if(t==='entrada')return /vinho|cafe|tour|passeio|cliente|degustacao|roteiro/.test(n)?'SGS Vinho & Café':'Recebimentos';if(/gasolina|combustivel|uber|onibus|transporte/.test(n))return 'Transporte';if(/mercado|comida|lanche|almoco|jantar|padaria|cafe/.test(n))return 'Alimentação';if(/agua|luz|energia|internet|aluguel|casa/.test(n))return 'Casa';if(/escola|apostila|aluno|imprimir|prova/.test(n))return 'Escola';if(/vinho|vinicola|tour|cliente|reels|instagram|cafe|queijo/.test(n))return 'SGS Vinho & Café';if(/remedio|consulta|medico|dentista/.test(n))return 'Saúde';return 'Outros'}
function descFromQuick(s){let d=String(s||'').replace(/r\$|reais|real/gi,' ').replace(/(?:^|\s)(\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:[,.]\d{1,2})?)(?:\s|$)/,' ');d=d.replace(/\b(recebi|recebido|recebida|entrada|entrou|ganhei|ganho)\b/gi,' ').replace(/\s+/g,' ').trim();return d||'Lançamento'}
function add(obj){items.unshift({id:Date.now(),tipo:obj.tipo||tipo,valor:Number(obj.valor)||0,desc:obj.desc||'Lançamento',cat:obj.cat||'Outros',forma:obj.forma||'Pix',data:obj.data||today(),created:new Date().toISOString()});save();render();}
function addManual(){const v=parseValor($('valor').value);if(!v){toast('Informe o valor.');return}add({tipo,valor:v,desc:$('desc').value.trim()||'Lançamento',cat:$('cat').value,forma:$('forma').value,data:$('data').value||today()});$('valor').value='';$('desc').value='';toast(tipo==='entrada'?'Entrada salva 💰':'Gasto salvo 💸')}
function addQuick(){const q=$('quickText').value.trim();if(!q){toast('Digite ou fale um lançamento.');return}const v=parseValor(q);if(!v){toast('Não encontrei o valor. Ex.: 150 gasolina');return}const t=inferTipo(q);add({tipo:t,valor:v,desc:descFromQuick(q),cat:inferCat(q,t),forma:inferForma(q),data:today()});$('quickText').value='';toast(t==='entrada'?'Entrada organizada 💰':'Gasto organizado 💸')}
$('addBtn').onclick=addManual;$('quickBtn').onclick=addQuick;$('quickText').addEventListener('keydown',e=>{if(e.key==='Enter')addQuick()});
function render(){const now=new Date(),ym=now.toISOString().slice(0,7);let entradas=0,saidas=0;items.forEach(i=>{if(String(i.data||'').slice(0,7)===ym){if(i.tipo==='entrada')entradas+=Number(i.valor)||0;else saidas+=Number(i.valor)||0}});$('totalIn').textContent=money(entradas);$('totalOut').textContent=money(saidas);$('saldo').textContent=money(entradas-saidas);$('saldo').style.color=(entradas-saidas)>=0?'var(--green)':'var(--red)';const list=$('list');if(!items.length){list.innerHTML='<div class="empty">Nenhum lançamento ainda.</div>';return}list.innerHTML=items.map(i=>`<div class="item"><div><div class="itemText">${escapeHtml(i.desc)}</div><div class="meta">${i.data||''} • ${escapeHtml(i.cat||'')} • ${escapeHtml(i.forma||'')}</div></div><div style="text-align:right"><div class="money ${i.tipo==='entrada'?'in':'out'}">${i.tipo==='entrada'?'+':'-'} ${money(i.valor)}</div><button class="del" onclick="delItem(${i.id})">×</button></div></div>`).join('')}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
window.delItem=id=>{items=items.filter(i=>i.id!==id);save();render();toast('Lançamento apagado.')}
$('csvBtn').onclick=()=>{const rows=[['data','tipo','valor','descricao','categoria','forma'],...items.map(i=>[i.data,i.tipo,i.valor,i.desc,i.cat,i.forma])];download('gastos-bruna.csv',rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\n'))}
$('backupBtn').onclick=()=>download('backup-gastos-bruna.json',JSON.stringify(items,null,2));
function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('quickText').focus();toast('Use o microfone do teclado.');return}try{const r=new SR();r.lang='pt-BR';r.interimResults=false;r.continuous=false;r.onstart=()=>toast('Ouvindo...');r.onresult=e=>{$('quickText').value=e.results[0][0].transcript;toast('Texto recebido. Toque em Organizar.')};r.onerror=()=>toast('Toque no campo e use o microfone do teclado.');r.start()}catch(e){$('quickText').focus();toast('Use o microfone do teclado.')}};
render();
</script>
</body>
</html>
