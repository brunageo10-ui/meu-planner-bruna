const DAYS={domingo:0,segunda:1,terca:2,terça:2,quarta:3,quinta:4,sexta:5,sabado:6,sábado:6};function nextDay(day){let d=new Date(),diff=(day-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return d}
function parseDate(text){let s=norm(text),d=new Date(),m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):d.getFullYear();if(y<100)y+=2000;return `${y}-${pad(m[2])}-${pad(m[1])}`}if(s.includes('amanha')){d.setDate(d.getDate()+1);return dk(d)}if(s.includes('hoje'))return dk(d);for(let k in DAYS)if(s.includes(k))return dk(nextDay(DAYS[k]));m=s.match(/\bdia\s+(\d{1,2})\b/);if(m&&!/todo|todos|mensal/.test(s)){let day=Number(m[1]);d.setDate(1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));if(d<new Date(Date.now()-86400000)){d.setMonth(d.getMonth()+1,1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return dk(d)}return''}
function parseTime(text){let s=norm(text),m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)\b/);if(!m)m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*h\b/);if(m)return pad(Number(m[1]))+':'+pad(m[2]||'00');if(/meio\s*dia/.test(s))return'12:00';if(/cedo|manha/.test(s))return'08:00';if(/tarde/.test(s))return'15:00';if(/noite/.test(s))return'19:00';return''}
function parseRecurrence(text){let s=norm(text),m=s.match(/\b(?:todo\s+dia|todos\s+os\s+dias|diariamente)\b/);if(m&&!/todo\s+dia\s+\d/.test(s))return{type:'daily',label:'todos os dias'};m=s.match(/\b(?:todo\s+dia|dia)\s+(\d{1,2})\s+(?:de\s+)?(?:todo\s+mes|todos\s+os\s+meses|mensal)\b/);if(m)return{type:'monthly',day:Number(m[1]),label:'todo dia '+Number(m[1])+' do mês'};m=s.match(/\b(?:todo|toda|todos\s+os|todas\s+as)\s+(domingo|segunda|terca|terça|quarta|quinta|sexta|sabado|sábado)s?\b/);if(m)return{type:'weekly',day:DAYS[m[1]],label:'toda semana'};return null}
function dateForTime(time){let d=new Date(),p=time.split(':').map(Number);d.setHours(p[0]||0,p[1]||0,0,0);if(d.getTime()<=Date.now()+60000)d.setDate(d.getDate()+1);return dk(d)}
function makeItem(text,old={}){let c=classify(text),time=parseTime(text),rec=parseRecurrence(text);if(rec&&!time)time='08:00';let date=rec?'':(parseDate(text)||(time?dateForTime(time):''));return{id:old.id||Date.now(),text,cat:c.cat,sub:c.sub,date,time,recurrence:rec,paused:!!old.paused,done:!!old.done,priority:!!old.priority,created:old.created||new Date().toISOString()}}
function isRoutine(t){return !!t.recurrence}function isActive(t){return !t.done&&!t.paused}function dueAt(t){if(t.date||t.time){let d=t.date?new Date(t.date+'T'+(t.time||'08:00')):new Date();if(!t.date){let p=(t.time||'08:00').split(':').map(Number);d.setHours(p[0]||0,p[1]||0,0,0);if(d<Date.now())d.setDate(d.getDate()+1)}return d}return null}function todayAt(time){let d=new Date(),p=(time||'23:59').split(':').map(Number);d.setHours(p[0]||0,p[1]||0,0,0);return d}function routineToday(t){let r=t.recurrence,d=new Date();if(!r)return false;if(r.type==='daily')return true;if(r.type==='weekly')return d.getDay()===r.day;if(r.type==='monthly')return d.getDate()===r.day;return false}
/* Só mostra aviso quando algo precisa de atenção; "aviso agendado" não aparece mais */
function reminderTag(t){if(!t.time||t.done)return'';let ev=dueAt(t);if(ev&&ev.getTime()<Date.now())return'<span class="warnTag">Horário passou</span>';let s=scheduled();if(s[t.id])return'';if(!('Notification' in window))return'<span class="warnTag">Sem notificação neste aparelho</span>';if(Notification.permission==='granted')return`<button class="warnTag" onclick="event.stopPropagation();reschedule(${t.id})">Agendar aviso</button>`;return'<button class="warnTag" onclick="event.stopPropagation();enableNotify()">Ativar notificações</button>'}
function renderToday(){E.todayLabel.textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});let today=dk(),items=[];tasks.filter(isActive).forEach(t=>{if(isRoutine(t)){if(routineToday(t))items.push({id:t.id,text:t.text,time:t.time||'08:00',cat:t.cat,routine:true,stamp:todayAt(t.time||'08:00').getTime()});return}let ev=dueAt(t);if(t.date===today||(ev&&dk(ev)===today))items.push({id:t.id,text:t.text,time:t.time||'Hoje',cat:t.cat,routine:false,stamp:ev?ev.getTime():todayAt('23:59').getTime()})});items=items.sort((a,b)=>a.stamp-b.stamp);
if(!items.length){E.todayList.innerHTML='<div class="lbl">Agora</div><div class="empty">Nada marcado para hoje. Ótimo respiro 🌿</div>';return}
let n=items[0],rest=items.slice(1,3),extra=items.length-1-rest.length,late=!n.routine&&/:/.test(n.time)&&n.stamp<Date.now()-60000;
let h=`<div class="lbl">Agora</div><div class="now"><div class="nowMain"><div class="nowMeta">${esc(n.time)}${late?' · atrasada':''} · ${esc(label(n.cat))}</div><div class="nowText">${esc(n.text)}</div></div>${n.routine?'':`<button class="bigCheck" aria-label="Marcar como feito" onclick="toggle(${n.id})">${ICON.check}</button>`}</div>`;
if(rest.length){h+='<div class="lbl">A seguir</div>'+rest.map(x=>`<div class="row"><span class="tm">${esc(x.time)}</span><div class="rt"><b>${esc(x.text)}</b><span>${x.routine?'Rotina · ':''}${esc(label(x.cat))}</span></div><i class="dot" style="background:${catColor(x.cat)}"></i>${x.routine?'':`<button class="smallCheck" aria-label="Marcar como feito" onclick="toggle(${x.id})">${ICON.checkSm}</button>`}</div>`).join('');if(extra>0)h+=`<div class="note" style="text-align:center">+ ${extra} ${extra>1?'tarefas':'tarefa'} hoje, na lista abaixo</div>`}
E.todayList.innerHTML=h}
function card(t,routine=false,history=false){let col=catColor(t.cat),parts=[];if(t.time)parts.push(`<span class="t">${esc(t.time)}</span>`);if(t.recurrence)parts.push(`<span>${esc(t.recurrence.label)}</span>`);else if(t.date)parts.push(`<span>${esc(dayLabel(t.date))}</span>`);parts.push(`<span class="cat"><i class="dot" style="background:${col}"></i>${esc(label(t.cat))}</span>`);let pr=t.priority&&!routine&&!history&&!t.done;
let left=routine?'<span></span>':`<button class="check" aria-label="${t.done?'Reabrir':'Concluir'}" onclick="toggle(${t.id})"><span class="box">${t.done?ICON.checkSm:''}</span></button>`;
let extra=routine?`<button class="small" onclick="event.stopPropagation();toggleRoutine(${t.id})">${t.paused?'Ativar rotina':'Pausar rotina'}</button>`:'';
let star=(routine||history)?'':`<button class="iconBtn ${t.priority?'on':''}" aria-label="${t.priority?'Remover prioridade':'Marcar como prioridade'}" onclick="priority(${t.id})">${t.priority?ICON.starOn:ICON.star}</button>`;
return`<div class="item ${pr?'pr':''} ${t.done?'done':''}">${left}<div class="body" onclick="edit(${t.id})"><div class="text">${esc(t.text)}</div><div class="meta">${parts.join('<span>·</span>')}</div>${reminderTag(t)}${extra}</div><div class="side">${star}<button class="iconBtn" aria-label="Apagar" onclick="delItem(${t.id})">${ICON.x}</button></div></div>`}
function filtered(a){return a.filter(t=>active==='Tudo'||t.cat===active)}function updateAdd(){E.add.hidden=!E.input.value.trim();E.input.style.height='auto';E.input.style.height=Math.min(E.input.scrollHeight,120)+'px'}
function render(){let today=dk(),activeItems=tasks.filter(isActive);E.todayCount.textContent=tasks.filter(t=>!isRoutine(t)&&!t.done&&t.date===today).length;E.schoolCount.textContent=activeItems.filter(t=>t.cat==='Escola').length;E.taskCount.textContent=tasks.filter(t=>!isRoutine(t)&&!t.done).length;E.routineCount.textContent=tasks.filter(t=>isRoutine(t)&&isActive(t)).length;E.routineMini.textContent=E.routineCount.textContent;E.historyMini.textContent=tasks.filter(t=>!isRoutine(t)&&t.done).length;E.filters.innerHTML=folders.map(c=>`<button class="chip ${c===active?'on':''}" data-cat="${esc(c)}">${c==='Tudo'?'':`<i class="dot" style="background:${catColor(c)}"></i>`}${esc(label(c))}</button>`).join('');E.filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});let tl=filtered(tasks.filter(t=>!isRoutine(t)&&!t.done)).sort((a,b)=>(b.priority?1:0)-(a.priority?1:0)||String(a.date+a.time).localeCompare(String(b.date+b.time)));E.taskList.innerHTML=tl.length?tl.map(t=>card(t)).join(''):'<div class="empty">Nenhuma tarefa aqui ainda 🌿</div>';let rl=filtered(tasks.filter(isRoutine));E.routineList.innerHTML=rl.length?rl.map(t=>card(t,true)).join(''):'<div class="empty">Nenhuma rotina aqui ainda.</div>';let dl=filtered(tasks.filter(t=>!isRoutine(t)&&t.done));E.doneList.innerHTML=dl.length?dl.map(t=>card(t,false,true)).join(''):'<div class="empty">Nenhuma tarefa concluída ainda.</div>';renderToday();renderSearch();updateAdd()}
let addBusy=false;function addTask(ev){if(ev){ev.preventDefault();ev.stopPropagation()}if(addBusy)return false;addBusy=true;setTimeout(()=>addBusy=false,800);let text=E.input.value.trim();if(!text)return toast('Escreva ou fale alguma coisa primeiro.');let t=makeItem(text);tasks.unshift(t);E.input.value='';saveTasks();toast('✅ Salvo em '+label(t.cat)+(t.time?' • '+t.time:''));scheduleRemote(t);return false}
function toggle(id){let t=tasks.find(x=>x.id==id);if(!t)return;t.done=!t.done;saveTasks();toast(t.done?'✅ Feito!':'Tarefa reaberta.')}function priority(id){let t=tasks.find(x=>x.id==id);if(!t)return;t.priority=!t.priority;saveTasks();toast(t.priority?'⭐ Marcada como prioridade.':'Prioridade removida.')}function toggleRoutine(id){let t=tasks.find(x=>x.id==id);if(!t)return;t.paused=!t.paused;saveTasks()}function delItem(id){if(!confirm('Apagar este item?'))return;tasks=tasks.filter(x=>x.id!=id);saveTasks();toast('Item apagado.')}function edit(id){let t=tasks.find(x=>x.id==id);if(!t)return;let txt=prompt('Edite a tarefa ou rotina:',t.text);if(txt===null)return;txt=txt.trim();if(!txt)return;Object.assign(t,makeItem(txt,t));saveTasks();scheduleRemote(t)}
let micT;function showMic(title,hint,listening=false){clearTimeout(micT);E.micBox.classList.add('on');E.micBox.classList.toggle('listening',listening);E.micTitle.textContent=title;E.micHint.textContent=hint;updateAdd();if(!listening)micT=setTimeout(()=>E.micBox.classList.remove('on'),6000)}function startDictation(ev){if(ev){ev.preventDefault();ev.stopPropagation()}E.input.focus();let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{let r=new SR();r.lang='pt-BR';r.interimResults=false;r.continuous=false;r.onstart=()=>showMic('Ouvindo...','Fale sua tarefa agora.',true);r.onresult=e=>{E.input.value=e.results[0][0].transcript;showMic('Texto recebido','Revise e toque em Organizar automaticamente.',false)};r.onerror=()=>{showMic('Use o microfone do teclado','Toque no microfone do teclado do iPhone e fale.',false);toast('Toque no microfone do teclado do iPhone.')};r.start();return false}catch(e){}}showMic('Use o microfone do teclado','Toque no microfone do teclado do iPhone e fale sua tarefa.',false);toast('🎙️ Toque no microfone do teclado do iPhone.');return false}E.input.addEventListener('input',updateAdd);
function renderSearch(){if(!E.searchPanel.classList.contains('open'))return;let q=norm(E.searchInput.value||'');if(!q){E.searchResults.innerHTML='<div class="result">Digite uma palavra para buscar.</div>';return}let found=tasks.filter(t=>norm([t.text,label(t.cat),t.sub,t.date,t.time,t.priority?'prioridade':''].join(' ')).includes(q)).slice(0,20);E.searchResults.innerHTML=found.length?found.map(t=>`<div class="result"><b>${esc(t.text)}</b><div class="meta"><span class="tag">${esc(label(t.cat))}</span>${t.time?`<span class="t">${t.time}</span>`:''}${t.priority?'<span>⭐ Prioridade</span>':''}</div><button class="searchAct" onclick="priority(${t.id})">${t.priority?'Remover ⭐':'Marcar ⭐'}</button> <button class="searchAct" onclick="edit(${t.id})">Editar</button></div>`).join(''):'<div class="result">Nada encontrado.</div>'}
function findFolderByName(n){let x=norm(n);return folders.find(c=>norm(label(c))===x||norm(c)===x)}function editFolders(){let op=prompt('Gerenciar pastas:\n1 - Adicionar\n2 - Renomear\n3 - Excluir','1');if(!op)return;if(op==='1'){let n=prompt('Nome da nova pasta:','');if(n&&!findFolderByName(n)){folders.push(n);localStorage.brunaFolders=JSON.stringify(folders);render();toast('📁 Pasta criada.')}}else if(op==='2'){let old=prompt('Qual pasta deseja renomear?','');let f=findFolderByName(old);if(!f||f==='Tudo')return toast('Não encontrei essa pasta.');let n=prompt('Novo nome:',label(f));if(!n)return;if(DEFAULT.includes(f))catNames[f]=n;else{tasks.forEach(t=>{if(t.cat===f)t.cat=n});folders[folders.indexOf(f)]=n;if(active===f)active=n}localStorage.brunaCategoryNames=JSON.stringify(catNames);localStorage.brunaFolders=JSON.stringify(folders);saveTasks()}else if(op==='3'){let old=prompt('Qual pasta deseja excluir?','');let f=findFolderByName(old);if(!f||f==='Tudo')return toast('Não encontrei essa pasta.');tasks.forEach(t=>{if(t.cat===f)t.cat='Pessoal'});folders=folders.filter(c=>c!==f);localStorage.brunaFolders=JSON.stringify(folders);saveTasks()}}
function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify({version:VERSION,tasks,folders,catNames},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='meu-planner-bruna-backup-'+dk()+'.json';a.click()}function importBackup(f){if(!f)return;let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);if(Array.isArray(d.tasks)){tasks=d.tasks;folders=[...DEFAULT];(d.folders||[]).forEach(x=>{if(x&&!folders.includes(x))folders.push(x)});catNames=d.catNames||{};localStorage.brunaTasks=JSON.stringify(tasks);localStorage.brunaFolders=JSON.stringify(folders);localStorage.brunaCategoryNames=JSON.stringify(catNames);render();toast('Backup importado.')}};r.readAsText(f)}
window.OneSignalDeferred=window.OneSignalDeferred||[];window.oneSignalReady=new Promise(res=>{window.OneSignalDeferred.push(async O=>{await O.init({appId:APP_ID,serviceWorkerParam:{scope:'./'},serviceWorkerPath:'OneSignalSDKWorker.js'});res(O)})});function shouldSchedule(t){return !t.done&&!t.paused&&(t.recurrence||t.time)}async function getSub(){let O=await oneSignalReady;if(Notification.permission!=='granted')throw Error('Permita as notificações em Ferramentas.');try{await O.User.PushSubscription.optIn()}catch(e){}for(let i=0;i<10;i++){let id=O.User?.PushSubscription?.id;if(id)return id;await new Promise(r=>setTimeout(r,500))}throw Error('Abra pela Tela Inicial e ative as notificações.')}async function scheduleRemote(t){try{if(!shouldSchedule(t))return;if(!('Notification'in window)||Notification.permission!=='granted'){render();return}let s=scheduled();if(s[t.id])return;let ev=dueAt(t);if(!ev&&t.recurrence){ev=todayAt(t.time||'08:00');if(ev<Date.now())ev.setDate(ev.getDate()+1)}if(!ev||ev<Date.now()+90000){toast('⏰ Horário muito próximo. Use pelo menos 2 minutos de antecedência.');render();return}let sub=await getSub();let r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscriptionId:sub,title:'Meu Planner 💛',message:t.text,sendAfter:ev.toISOString()})});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Error('servidor não confirmou');s[t.id]={sendAt:ev.toISOString(),notificationId:j.id||j.notification_id||''};saveScheduled(s);toast('🔔 Aviso agendado para '+(t.time||''));render()}catch(e){toast('Tarefa salva, mas aviso não foi agendado: '+e.message);render()}}
async function enableNotify(){try{let O=await oneSignalReady;await O.Notifications.requestPermission();await getSub();E.notifyStatus.textContent='✅ Notificações autorizadas.';E.notifyBtn.innerHTML='Notificações<small>ativadas</small>';toast('Notificações ativadas.');for(const t of tasks.filter(isActive))await scheduleRemote(t)}catch(e){toast(e.message)}}async function reschedule(id){let t=tasks.find(x=>x.id==id);if(t)await scheduleRemote(t)}
function exportCalendar(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meu Planner Bruna//PT-BR','CALSCALE:GREGORIAN','X-WR-CALNAME:Meu Planner — Bruna'];tasks.filter(isActive).forEach(t=>{let ev=dueAt(t);if(!ev)return;let end=new Date(ev.getTime()+1800000);let stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';lines.push('BEGIN:VEVENT','UID:bruna-'+t.id+'@planner','DTSTAMP:'+stamp,'SUMMARY:'+t.text.replace(/,/g,'\\,'),'DTSTART:'+ev.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTEND:'+end.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','END:VEVENT')});lines.push('END:VCALENDAR');let a=document.createElement('a'),blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});a.href=URL.createObjectURL(blob);a.download='meu-planner-bruna.ics';a.click()}
