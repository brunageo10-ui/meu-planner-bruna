<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#7c1735'><link rel='manifest' href='manifest.json'><title>Meu Planner — Bruna V7.1</title><style>
:root{--wine:#7c1735;--bg:#fbf5f0;--card:#fff;--ink:#2a2022;--muted:#7b6d70;--line:#eadbd7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:auto;padding:22px 16px 100px}h1{font-family:Georgia,serif;margin:8px 0 2px;font-size:32px}.sub{color:var(--muted);margin-bottom:22px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 28px #6b203010}.hero{background:linear-gradient(135deg,#fff,#f8e7e2)}textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;resize:vertical;background:#fff}.actions{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:var(--wine);color:white;flex:1}.secondary{background:#f2e5e2;color:var(--wine)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:22px;color:var(--wine)}h2{font-size:20px;margin:24px 2px 12px}.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}.check{width:22px;height:22px;border:2px solid #c8b6b1;border-radius:7px;flex:none;margin-top:2px}.done{opacity:.5;text-decoration:line-through}.meta{font-size:12px;color:var(--muted);margin-top:5px}.tag{display:inline-block;background:#f6e1e7;color:var(--wine);padding:3px 8px;border-radius:999px;margin-right:5px}.empty{text-align:center;color:var(--muted);padding:25px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 16px;border-radius:14px;display:none;max-width:90%}.filter{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px}.chip.active{background:var(--wine);color:#fff}.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.time{font-weight:700;color:var(--wine);margin-left:5px}.reminder{display:inline-block;background:#f3eee9;padding:3px 8px;border-radius:999px;margin-left:5px}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8b1737">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Planner">
</head><body><main><h1>Olá, Bruna! 👋</h1><div class='sub'>Escreva ou fale. Eu organizo para você.</div>
<section class='hero'><strong>✨ O que você precisa lembrar ou fazer?</strong><textarea id='input' placeholder='Ex.: Quinta preciso preparar uma atividade de Geografia para o 7º ano e postar um Reels da vinícola à noite.'></textarea><div class='actions'><button class='btn secondary' id='voice'>🎙️ Falar</button><button class='btn primary' id='add'>Organizar automaticamente</button></div><div class='hint'>Versão 7 • O app identifica assunto, turma, data, horário e frases como “me lembre 30 minutos antes”.</div>
<div style="margin-top:12px"><button class="btn secondary" id="notifyBtn" style="width:100%">🔔 Ativar notificações</button></div>
<div class="hint" id="notifyStatus">As notificações precisam ser autorizadas no iPhone.</div></section>
<div class='grid'><div class='stat'><b id='todayCount'>0</b>Hoje</div><div class='stat'><b id='schoolCount'>0</b>Escola</div><div class='stat'><b id='tourCount'>0</b>SGS</div><div class='stat'><b id='pendingCount'>0</b>Pendentes</div></div>
<h2>Minhas tarefas</h2><div class='filter' id='filters'></div><div id='list'></div></main><div class='toast' id='toast'></div>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "93373f2b-4612-4a68-9eaa-c0fdade3aee0",
    
    
    notifyButton: { enable: false }
  });
  if ("Notification" in window && Notification.permission === "granted") {
  try {
    await OneSignal.User.PushSubscription.optIn();
  } catch (e) {
    console.log("OneSignal opt-in:", e);
  }
}
});
</script><script>
const CATS=['Tudo','Escola','SGS Vinho & Café','Pessoal','Compromissos','Compras','Hábitos','Ideias'];let active='Tudo';let tasks=JSON.parse(localStorage.getItem('brunaTasks')||'[]');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function schoolGrade(s){let m=s.match(/\b([6789])\s*(?:º|o)?\s*ano\b/);if(m)return m[1]+'º ano';let w={sexto:'6º ano',sexta:'6º ano',setimo:'7º ano',setima:'7º ano',oitavo:'8º ano',oitava:'8º ano',nono:'9º ano',nona:'9º ano'};for(let k in w)if(new RegExp('\\b'+k+'\\s+ano\\b').test(s))return w[k];return ''}
function classify(text){let s=norm(text),cat='Pessoal',sub='',grade=schoolGrade(s);if(grade||/alun|prova|avaliacao|geografia|apostila|bncc|aula|escola|relatorio|dever|atividade/.test(s)){cat='Escola';if(grade)sub=grade;else if(/prova|avaliacao/.test(s))sub='Avaliações';else if(/relatorio/.test(s))sub='Relatórios';else sub='Planejamento'}else if(/sgs|vinho|vinicola|cafe|queijo|reels|story|stories|instagram|turis|fazenda|degustacao|cliente|roteiro/.test(s)){cat='SGS Vinho & Café';if(/reels|story|stories|instagram|post|conteudo/.test(s))sub='Conteúdo';else if(/cliente/.test(s))sub='Clientes';else sub='Experiências'}else if(/comprar|mercado|farmacia|compra/.test(s))cat='Compras';else if(/reuniao|consulta|dentista|medico|evento|compromisso|unha/.test(s))cat='Compromissos';else if(/habito|agua|exercicio|caminhar|academia|leitura/.test(s))cat='Hábitos';else if(/ideia|pensar|talvez|quem sabe/.test(s))cat='Ideias';return {cat,sub};}
function parseDate(text){let s=norm(text),d=new Date(),day=d.getDay();let map={domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};for(let k in map)if(s.includes(k)){let diff=(map[k]-day+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return d.toISOString().slice(0,10)}if(s.includes('amanha')){d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}if(s.includes('hoje'))return d.toISOString().slice(0,10);let m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):d.getFullYear();if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}return ''}
function parseTime(text){let s=norm(text),m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)\b/);if(!m)m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*h(?:oras?)?\b/);if(!m)return '';return String(Number(m[1])).padStart(2,'0')+':'+String(m[2]||'00').padStart(2,'0')}
function parseReminder(text){
  let s=norm(text);
  const nums={
    'um':1,'uma':1,'dois':2,'duas':2,'tres':3,'quatro':4,'cinco':5,'seis':6,'sete':7,'oito':8,'nove':9,'dez':10,
    'onze':11,'doze':12,'treze':13,'quatorze':14,'catorze':14,'quinze':15,'dezesseis':16,'dezessete':17,'dezoito':18,'dezenove':19,
    'vinte':20,'trinta':30,'quarenta':40,'cinquenta':50,'sessenta':60
  };
  let m=s.match(/(?:me\s+)?(?:lembre|avise|lembrar)\s+(?:com\s+)?(\d+|[a-z]+)\s*(minuto|minutos|min|hora|horas|h)\s+antes/);
  if(!m)return 0;
  let n=/^\d+$/.test(m[1])?Number(m[1]):(nums[m[1]]||0);
  if(!n)return 0;
  return /^(h|hora)/.test(m[2])?n*60:n
}
function reminderLabel(mins){if(!mins)return '';if(mins%60===0)return (mins/60)+'h antes';return mins+' min antes'}
function addTask(){let text=document.getElementById('input').value.trim();if(!text)return toast('Escreva ou fale alguma coisa primeiro.');let c=classify(text),time=parseTime(text),reminder=parseReminder(text);tasks.unshift({id:Date.now(),text,cat:c.cat,sub:c.sub,date:parseDate(text),time,reminder,done:false,created:new Date().toISOString()});save();document.getElementById('input').value='';toast(`Organizado em ${c.cat}${c.sub?' › '+c.sub:''}${time?' • '+time:''}${reminder?' • aviso '+reminderLabel(reminder):''}`)}
function save(){localStorage.setItem('brunaTasks',JSON.stringify(tasks));render()}
function render(){let today=new Date().toISOString().slice(0,10);document.getElementById('todayCount').textContent=tasks.filter(t=>!t.done&&t.date===today).length;document.getElementById('schoolCount').textContent=tasks.filter(t=>!t.done&&t.cat==='Escola').length;document.getElementById('tourCount').textContent=tasks.filter(t=>!t.done&&t.cat==='SGS Vinho & Café').length;document.getElementById('pendingCount').textContent=tasks.filter(t=>!t.done).length;document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="chip ${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('');let arr=tasks.filter(t=>active==='Tudo'||t.cat===active),el=document.getElementById('list');if(!arr.length){el.innerHTML='<div class="empty">Nenhuma tarefa aqui ainda 🌿</div>';return}el.innerHTML=arr.map(t=>`<div class="item ${t.done?'done':''}"><button class="check" onclick="toggle(${t.id})">${t.done?'✓':''}</button><div style="flex:1"><div>${esc(t.text)}</div><div class="meta"><span class="tag">${t.cat}</span>${t.sub?`<span class="tag">${t.sub}</span>`:''}${t.date?' 📅 '+new Date(t.date+'T12:00').toLocaleDateString('pt-BR'):''}${t.time?` <span class="time">🕐 ${esc(t.time)}</span>`:''}${t.reminder?` <span class="reminder">🔔 ${reminderLabel(t.reminder)}</span>`:''}</div></div><button class="btn secondary" style="padding:7px 9px" onclick="del(${t.id})">×</button></div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggle(id){let t=tasks.find(x=>x.id===id);t.done=!t.done;save()}function del(id){tasks=tasks.filter(x=>x.id!==id);save()}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
document.getElementById('add').onclick=addTask;document.getElementById('input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')addTask()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('voice').onclick=()=>{if(!SR)return toast('O reconhecimento de voz depende do navegador. No iPhone, você também pode usar o microfone do teclado.');let r=new SR();r.lang='pt-BR';r.onresult=e=>document.getElementById('input').value=e.results[0][0].transcript;r.onerror=()=>toast('Não consegui ouvir. Tente novamente.');r.start()};
<script>
(async function(){
  const status = document.getElementById('notifyStatus');
  const btn = document.getElementById('notifyBtn');

  function refreshNotificationUI(){
   try {
  OneSignalDeferred.push(function(OneSignal){
    if (OneSignal.Notifications.permission || OneSignal.User.PushSubscription.optedIn) {
      if(status) status.textContent='✅ Notificações autorizadas no iPhone.';
      if(btn) btn.textContent='🔔 Notificações ativadas';
    }
  });
     return;
} catch(e) {} 
    if(!('Notification' in window)){
      if(status) status.textContent='Este modo do navegador não oferece notificações web.';
      if(btn) btn.disabled=true;
      return;
    }
    if(Notification.permission==='granted'){
      if(status) status.textContent='✅ Notificações autorizadas neste iPhone.';
      if(btn) btn.textContent='🔔 Notificações ativadas';
    } else if(Notification.permission==='denied'){
      if(status) status.textContent='⚠️ As notificações estão bloqueadas. Será preciso liberá-las nos Ajustes do iPhone.';
    } else {
      if(status) status.textContent='Toque em “Ativar notificações” e permita os avisos.';
    }
  }

  

  if(btn){
    btn.addEventListener('click', async ()=>{
      if(!('Notification' in window)) return refreshNotificationUI();
      try {
        const p = await OneSignal.Notifications.requestPermission();
        refreshNotificationUI();
        if(Notification.permission==='granted'){
          const reg = await navigator.serviceWorker.ready;
          reg.showNotification('Meu Planner 💛', {
            body:'Notificações ativadas. Este é um aviso de teste.',
            icon:'./icon-192.png',
            badge:'./icon-192.png'
          });
        }
      } catch(e) {
if(status) status.textContent='Erro: '+e.message;
      }
    });
  }
  refreshNotificationUI();
})();
</script>
</body></html>
