<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b1737">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Planner">
<link rel="manifest" href="manifest.webmanifest">
<title>Meu Planner — Bruna V7.3</title>
<style>
:root{--wine:#7c1735;--bg:#fbf5f0;--card:#fff;--ink:#2a2022;--muted:#7b6d70;--line:#eadbd7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:auto;padding:22px 16px 100px}h1{font-family:Georgia,serif;margin:8px 0 2px;font-size:32px}.sub{color:var(--muted);margin-bottom:22px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 28px #6b203010}.hero{background:linear-gradient(135deg,#fff,#f8e7e2)}textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;resize:vertical;background:#fff}.actions{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:var(--wine);color:white;flex:1}.secondary{background:#f2e5e2;color:var(--wine)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:22px;color:var(--wine)}h2{font-size:20px;margin:24px 2px 12px}.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}.check{width:22px;height:22px;border:2px solid #c8b6b1;border-radius:7px;flex:none;margin-top:2px}.done{opacity:.5;text-decoration:line-through}.meta{font-size:12px;color:var(--muted);margin-top:5px}.tag{display:inline-block;background:#f6e1e7;color:var(--wine);padding:3px 8px;border-radius:999px;margin-right:5px}.empty{text-align:center;color:var(--muted);padding:25px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 16px;border-radius:14px;display:none;max-width:90%;z-index:20}.filter{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px}.chip.active{background:var(--wine);color:#fff}.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px}.time{font-weight:700;color:var(--wine);margin-left:5px}.reminder{display:inline-block;background:#f3eee9;padding:3px 8px;border-radius:999px;margin-left:5px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
  <h1>Olá, Bruna! 👋</h1>
  <div class="sub">Escreva ou fale. Eu organizo para você.</div>

  <section class="hero">
    <strong>✨ O que você precisa lembrar ou fazer?</strong>
    <textarea id="input" placeholder="Ex.: Quinta preciso preparar uma atividade de Geografia para o 7º ano e postar um Reels da vinícola à noite."></textarea>
    <div class="actions">
      <button class="btn secondary" id="voice">🎙️ Falar</button>
      <button class="btn primary" id="add">Organizar automaticamente</button>
    </div>
    <div class="hint">Versão 7.3 • O app agenda lembretes e cancela o aviso quando você apaga a tarefa.</div>
    <div style="margin-top:12px"><button class="btn secondary" id="notifyBtn" style="width:100%">🔔 Ativar notificações</button></div>
    <div class="hint" id="notifyStatus">As notificações precisam ser autorizadas no iPhone.</div>
  </section>

  <div class="grid">
    <div class="stat"><b id="todayCount">0</b>Hoje</div>
    <div class="stat"><b id="schoolCount">0</b>Escola</div>
    <div class="stat"><b id="tourCount">0</b>SGS</div>
    <div class="stat"><b id="pendingCount">0</b>Pendentes</div>
  </div>

  <h2>Minhas tarefas</h2>
  <div class="filter" id="filters"></div>
  <div id="list"></div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
const APP_ID = '93373f2b-4612-4a68-9eaa-c0fdade3aee0';
const WORKER_URL = 'https://still-dew-5c29.brunageo10.workers.dev/';
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.oneSignalReady = new Promise(resolve => {
  window.OneSignalDeferred.push(async function(OneSignal) {
    try {
      await OneSignal.init({ appId: APP_ID, notifyButton: { enable: false } });
      if ('Notification' in window && Notification.permission === 'granted') {
        try { await OneSignal.User.PushSubscription.optIn(); } catch(e) { console.log('OneSignal opt-in:', e); }
      }
      resolve(OneSignal);
    } catch(e) {
      console.log('OneSignal init:', e);
      resolve(null);
    }
  });
});
</script>
<script>
const CATS=['Tudo','Escola','SGS Vinho & Café','Pessoal','Compromissos','Compras','Hábitos','Ideias'];
let active='Tudo';
let tasks=JSON.parse(localStorage.getItem('brunaTasks')||'[]');
let schedulingNow=false;

const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function scheduledStore(){try{return JSON.parse(localStorage.getItem('brunaScheduled')||'{}')}catch(e){return {}}}
function saveScheduledStore(x){localStorage.setItem('brunaScheduled',JSON.stringify(x))}
function scheduledInfo(id){let v=scheduledStore()[id];if(!v)return null;if(typeof v==='string')return {sendAt:v};return v}

function schoolGrade(s){let m=s.match(/\b([6789])\s*(?:º|o)?\s*ano\b/);if(m)return m[1]+'º ano';let w={sexto:'6º ano',sexta:'6º ano',setimo:'7º ano',setima:'7º ano',oitavo:'8º ano',oitava:'8º ano',nono:'9º ano',nona:'9º ano'};for(let k in w)if(new RegExp('\\b'+k+'\\s+ano\\b').test(s))return w[k];return ''}
function classify(text){let s=norm(text),cat='Pessoal',sub='',grade=schoolGrade(s);if(grade||/alun|prova|avaliacao|geografia|apostila|bncc|aula|escola|relatorio|dever|atividade/.test(s)){cat='Escola';if(grade)sub=grade;else if(/prova|avaliacao/.test(s))sub='Avaliações';else if(/relatorio/.test(s))sub='Relatórios';else sub='Planejamento'}else if(/sgs|vinho|vinicola|cafe|queijo|reels|story|stories|instagram|turis|fazenda|degustacao|cliente|roteiro/.test(s)){cat='SGS Vinho & Café';if(/reels|story|stories|instagram|post|conteudo/.test(s))sub='Conteúdo';else if(/cliente/.test(s))sub='Clientes';else sub='Experiências'}else if(/comprar|mercado|farmacia|compra/.test(s))cat='Compras';else if(/reuniao|consulta|dentista|medico|evento|compromisso|unha/.test(s))cat='Compromissos';else if(/habito|agua|exercicio|caminhar|academia|leitura/.test(s))cat='Hábitos';else if(/ideia|pensar|talvez|quem sabe/.test(s))cat='Ideias';return {cat,sub};}
function parseDate(text){let s=norm(text),d=new Date(),day=d.getDay();let map={domingo:0,segunda:1,terca:2,terça:2,quarta:3,quinta:4,sexta:5,sabado:6,sábado:6};for(let k in map)if(s.includes(k)){let diff=(map[k]-day+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return dateKey(d)}if(s.includes('amanha')||s.includes('amanhã')){d.setDate(d.getDate()+1);return dateKey(d)}if(s.includes('hoje'))return dateKey(d);let m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):d.getFullYear();if(y<100)y+=2000;return `${y}-${pad(m[2])}-${pad(m[1])}`}return ''}
function parseTime(text){let s=norm(text),m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)\b/);if(!m)m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*h(?:oras?)?\b/);if(!m)return '';return pad(Number(m[1]))+':'+pad(m[2]||'00')}
function parseReminder(text){let s=norm(text);const nums={'um':1,'uma':1,'dois':2,'duas':2,'tres':3,'três':3,'quatro':4,'cinco':5,'seis':6,'sete':7,'oito':8,'nove':9,'dez':10,'onze':11,'doze':12,'treze':13,'quatorze':14,'catorze':14,'quinze':15,'dezesseis':16,'dezessete':17,'dezoito':18,'dezenove':19,'vinte':20,'trinta':30,'quarenta':40,'cinquenta':50,'sessenta':60};let m=s.match(/(?:me\s+)?(?:lembre|avise|lembrar)\s+(?:com\s+)?(\d+|[a-z]+)\s*(minuto|minutos|min|hora|horas|h)\s+antes/);if(!m)return 0;let n=/^\d+$/.test(m[1])?Number(m[1]):(nums[m[1]]||0);if(!n)return 0;return /^(h|hora)/.test(m[2])?n*60:n}
function reminderLabel(mins){if(!mins)return '';if(mins%60===0)return (mins/60)+'h antes';return mins+' min antes'}
function relativeDue(text,created){let s=norm(text);let m=s.match(/daqui\s+(\d+)\s*(minuto|minutos|min|hora|horas|h)\b/);if(!m)return null;let n=Number(m[1]);let mins=/h|hora/.test(m[2])?n*60:n;return new Date(new Date(created||Date.now()).getTime()+mins*60000)}
function eventDueAt(t){let rel=relativeDue(t.text,t.created);if(rel)return rel;if(t.time){let d=t.date?new Date(t.date+'T'+t.time):new Date();if(!t.date){let p=t.time.split(':').map(Number);d.setHours(p[0],p[1],0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1)}return d}return null}
function reminderSendAt(t){let event=eventDueAt(t);if(!event)return null;let rel=relativeDue(t.text,t.created);if(rel)return rel;if(t.reminder)return new Date(event.getTime()-t.reminder*60000);return event}
function hasReminderIntent(text){let s=norm(text);return /\b(lembre|avise|lembrar|aviso)\b/.test(s)||/daqui\s+\d+/.test(s)}
async function getSubscriptionId(){const OneSignal=await window.oneSignalReady;if(!OneSignal)throw new Error('OneSignal não carregou.');if(!('Notification' in window))throw new Error('Este navegador não oferece notificações web.');if(Notification.permission!=='granted')throw new Error('Ative as notificações primeiro.');try{await OneSignal.User.PushSubscription.optIn()}catch(e){}for(let i=0;i<12;i++){let id=OneSignal.User&&OneSignal.User.PushSubscription&&OneSignal.User.PushSubscription.id;if(id)return id;await new Promise(r=>setTimeout(r,500))}throw new Error('Não encontrei a inscrição do OneSignal. Abra o app pela Tela Inicial e toque em Ativar notificações.')}
async function scheduleRemoteReminder(t,quiet=false){let sendAt=reminderSendAt(t);if(!sendAt||!hasReminderIntent(t.text))return false;if(sendAt.getTime()<Date.now()+20000){if(!quiet)toast('Esse horário já passou ou está muito em cima.');return false}let sent=scheduledStore();if(sent[t.id])return true;let subscriptionId=await getSubscriptionId();let res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscriptionId,title:'Meu Planner 💛',message:t.text||'Você tem um lembrete.',sendAfter:sendAt.toISOString()})});let txt=await res.text();if(!res.ok)throw new Error(txt||('Erro '+res.status));let result={};try{result=JSON.parse(txt)}catch(e){}sent[t.id]={sendAt:sendAt.toISOString(),notificationId:result.id||result.notification_id||result.notificationId||'',createdAt:new Date().toISOString()};saveScheduledStore(sent);return true}
async function schedulePendingReminders(quiet=true){if(schedulingNow)return;schedulingNow=true;try{for(const t of tasks){if(!t.done)await scheduleRemoteReminder(t,quiet).catch(e=>{if(!quiet)toast('Não consegui agendar: '+e.message)})}}finally{schedulingNow=false}}
async function cancelScheduledInfo(info){let obj=typeof info==='string'?{sendAt:info}:info;if(!obj||!obj.notificationId)return false;let res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',notificationId:obj.notificationId})});let txt=await res.text();if(!res.ok)throw new Error(txt||('Erro '+res.status));return true}
async function firePlannerReminder(t){if(!('Notification' in window)||Notification.permission!=='granted')return;try{const reg=await navigator.serviceWorker.ready;reg.showNotification('Meu Planner 💛',{body:t.text||'Você tem um lembrete.',icon:'./icon-192.png',badge:'./icon-192.png'});}catch(e){}}
function checkLocalReminders(){let sent=JSON.parse(localStorage.getItem('brunaNotified')||'[]');let now=Date.now();tasks.forEach(t=>{let due=reminderSendAt(t);if(!due||t.done||sent.includes(t.id)||!hasReminderIntent(t.text))return;let diff=due.getTime()-now;if(diff<=0&&diff>-300000){sent.push(t.id);firePlannerReminder(t)}});localStorage.setItem('brunaNotified',JSON.stringify(sent.slice(-200)))}
setInterval(checkLocalReminders,15000);
function addTask(){let text=document.getElementById('input').value.trim();if(!text)return toast('Escreva ou fale alguma coisa primeiro.');let c=classify(text),time=parseTime(text),reminder=parseReminder(text);let t={id:Date.now(),text,cat:c.cat,sub:c.sub,date:parseDate(text),time,reminder,done:false,created:new Date().toISOString()};tasks.unshift(t);save();document.getElementById('input').value='';let when=reminderSendAt(t);let msg=`Organizado em ${c.cat}${c.sub?' › '+c.sub:''}${time?' • '+time:''}${reminder?' • aviso '+reminderLabel(reminder):''}`;toast(msg);if(when&&hasReminderIntent(text)){scheduleRemoteReminder(t).then(ok=>{if(ok)toast('🔔 Lembrete agendado para '+when.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}));render()}).catch(e=>toast('Tarefa salva, mas o aviso não foi agendado: '+e.message))}}
function save(){localStorage.setItem('brunaTasks',JSON.stringify(tasks));render()}
function render(){let today=dateKey(new Date());document.getElementById('todayCount').textContent=tasks.filter(t=>!t.done&&t.date===today).length;document.getElementById('schoolCount').textContent=tasks.filter(t=>!t.done&&t.cat==='Escola').length;document.getElementById('tourCount').textContent=tasks.filter(t=>!t.done&&t.cat==='SGS Vinho & Café').length;document.getElementById('pendingCount').textContent=tasks.filter(t=>!t.done).length;document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="chip ${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('');let arr=tasks.filter(t=>active==='Tudo'||t.cat===active),el=document.getElementById('list');if(!arr.length){el.innerHTML='<div class="empty">Nenhuma tarefa aqui ainda 🌿</div>';return}el.innerHTML=arr.map(t=>{let scheduled=scheduledInfo(t.id);return `<div class="item ${t.done?'done':''}"><button class="check" onclick="toggle(${t.id})">${t.done?'✓':''}</button><div style="flex:1"><div>${esc(t.text)}</div><div class="meta"><span class="tag">${t.cat}</span>${t.sub?`<span class="tag">${t.sub}</span>`:''}${t.date?' 📅 '+new Date(t.date+'T12:00').toLocaleDateString('pt-BR'):''}${t.time?` <span class="time">🕐 ${esc(t.time)}</span>`:''}${t.reminder?` <span class="reminder">🔔 ${reminderLabel(t.reminder)}</span>`:''}${scheduled?` <span class="reminder">✅ aviso agendado</span>`:''}</div></div><button class="btn secondary" style="padding:7px 9px" onclick="del(${t.id})">×</button></div>`}).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toggle(id){let t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}
function del(id){let info=scheduledInfo(id);tasks=tasks.filter(x=>x.id!==id);let sent=scheduledStore();delete sent[id];saveScheduledStore(sent);save();if(info){cancelScheduledInfo(info).then(ok=>toast(ok?'🔕 Tarefa apagada e aviso cancelado.':'Tarefa apagada.')).catch(e=>toast('Tarefa apagada. Se o aviso já estava muito perto, ele ainda pode tocar.'))}else{toast('Tarefa apagada.')}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3600)}
document.getElementById('add').onclick=addTask;
document.getElementById('input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')addTask()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('voice').onclick=()=>{if(!SR)return toast('O reconhecimento de voz depende do navegador. No iPhone, você também pode usar o microfone do teclado.');let r=new SR();r.lang='pt-BR';r.onresult=e=>document.getElementById('input').value=e.results[0][0].transcript;r.onerror=()=>toast('Não consegui ouvir. Tente novamente.');r.start()};
</script>
<script>
(async function(){
  const status=document.getElementById('notifyStatus');
  const btn=document.getElementById('notifyBtn');
  function setEnabled(){if(status)status.textContent='✅ Notificações autorizadas no iPhone.';if(btn)btn.textContent='🔔 Notificações ativadas'}
  async function refreshNotificationUI(){
    if(!('Notification' in window)){if(status)status.textContent='Este modo do navegador não oferece notificações web.';if(btn)btn.disabled=true;return}
    if(Notification.permission==='granted'){setEnabled();schedulePendingReminders(true);return}
    if(Notification.permission==='denied'){if(status)status.textContent='⚠️ As notificações estão bloqueadas. Será preciso liberá-las nos Ajustes do iPhone.';return}
    if(status)status.textContent='Toque em “Ativar notificações” e permita os avisos.';
  }
  if(btn){btn.addEventListener('click',async()=>{
    if(!('Notification' in window))return refreshNotificationUI();
    try{
      const OneSignal=await window.oneSignalReady;
      if(OneSignal){await OneSignal.Notifications.requestPermission();try{await OneSignal.User.PushSubscription.optIn()}catch(e){}}
      await refreshNotificationUI();
      if(Notification.permission==='granted'){
        try{const reg=await navigator.serviceWorker.ready;reg.showNotification('Meu Planner 💛',{body:'Notificações ativadas. Este é um aviso de teste.',icon:'./icon-192.png',badge:'./icon-192.png'});}catch(e){}
        schedulePendingReminders(false);
      }
    }catch(e){if(status)status.textContent='Erro: '+e.message}
  })}
  await refreshNotificationUI();
  render();
})();
</script>
</body>
</html>
