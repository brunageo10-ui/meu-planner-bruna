:root{--wine:#7c1735;--bg:#fbf5f0;--card:#fff;--ink:#2a2022;--muted:#7b6d70;--line:#eadbd7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:auto;padding:22px 16px 100px}h1{font-family:Georgia,serif;margin:8px 0 2px;font-size:32px}.sub{color:var(--muted);margin-bottom:22px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 8px 28px #6b203010}.hero{background:linear-gradient(135deg,#fff,#f8e7e2)}textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;resize:vertical;background:#fff}.actions{display:flex;gap:10px;margin-top:10px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer}.primary{background:var(--wine);color:white;flex:1}.secondary{background:#f2e5e2;color:var(--wine)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:22px;color:var(--wine)}h2{font-size:20px;margin:24px 2px 12px}.section-title{margin-top:20px}.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0}.routine-item{background:linear-gradient(135deg,#fff,#fff7f3)}.check{width:22px;height:22px;border:2px solid #c8b6b1;border-radius:7px;flex:none;margin-top:2px}.done{opacity:.5;text-decoration:line-through}.meta{font-size:12px;color:var(--muted);margin-top:5px}.tag{display:inline-block;background:#f6e1e7;color:var(--wine);padding:3px 8px;border-radius:999px;margin-right:5px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:25px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 16px;border-radius:14px;display:none;max-width:90%;z-index:20}.filter{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px}.chip.active{background:var(--wine);color:#fff}.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px}.time{font-weight:700;color:var(--wine);margin-left:5px}.reminder{display:inline-block;background:#f3eee9;padding:3px 8px;border-radius:999px;margin-left:5px;margin-top:4px}.small-note{font-size:13px;color:var(--muted);margin-top:-6px;margin-bottom:8px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}

  <div id="list"></div>
</main>

<script>
const APP_ID='93373f2b-4612-4a68-9eaa-c0fdade3aee0';
const WORKER_URL='https://still-dew-5c29.brunageo10.workers.dev/';
window.OneSignalDeferred=window.OneSignalDeferred||[];
window.oneSignalReady=new Promise(resolve=>{
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.init({appId:APP_ID,notifyButton:{enable:false}});
      if('Notification' in window&&Notification.permission==='granted'){
        try{await OneSignal.User.PushSubscription.optIn()}catch(e){console.log('OneSignal opt-in:',e)}
      }
      resolve(OneSignal);

  });

<script>
const CATS=['Tudo','Escola','SGS Vinho & Café','Pessoal','Compromissos','Compras','Hábitos','Ideias'];
const NUMS={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60};
const NUM_PATTERN='\\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta';
const DAYS={domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};
const DAY_LABELS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
let active='Tudo';
let tasks=JSON.parse(localStorage.getItem('brunaTasks')||'[]');
let schedulingNow=false;

const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function pad(n){return String(n).padStart(2,'0')}
function numberFromWord(v){v=norm(String(v||'').trim());if(/^\d+$/.test(v))return Number(v);return NUMS[v]||0}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function scheduledStore(){try{return JSON.parse(localStorage.getItem('brunaScheduled')||'{}')}catch(e){return {}}}
function saveScheduledStore(x){localStorage.setItem('brunaScheduled',JSON.stringify(x))}
function scheduledInfo(id){let v=scheduledStore()[id];if(!v)return null;if(typeof v==='string')return {sendAt:v};return v}

function schoolGrade(s){let m=s.match(/\b([6789])\s*(?:º|o)?\s*ano\b/);if(m)return m[1]+'º ano';let w={sexto:'6º ano',sexta:'6º ano',setimo:'7º ano',setima:'7º ano',oitavo:'8º ano',oitava:'8º ano',nono:'9º ano',nona:'9º ano'};for(let k in w)if(new RegExp('\\b'+k+'\\s+ano\\b').test(s))return w[k];return ''}
function classify(text){let s=norm(text),cat='Pessoal',sub='',grade=schoolGrade(s);if(grade||/alun|prova|avaliacao|geografia|apostila|bncc|aula|escola|relatorio|dever|atividade/.test(s)){cat='Escola';if(grade)sub=grade;else if(/prova|avaliacao/.test(s))sub='Avaliações';else if(/relatorio/.test(s))sub='Relatórios';else sub='Planejamento'}else if(/sgs|vinho|vinicola|cafe|queijo|reels|story|stories|instagram|turis|fazenda|degustacao|cliente|roteiro/.test(s)){cat='SGS Vinho & Café';if(/reels|story|stories|instagram|post|conteudo/.test(s))sub='Conteúdo';else if(/cliente/.test(s))sub='Clientes';else sub='Experiências'}else if(/comprar|mercado|farmacia|compra/.test(s))cat='Compras';else if(/reuniao|consulta|dentista|medico|evento|compromisso|unha/.test(s))cat='Compromissos';else if(/habito|agua|exercicio|caminhar|academia|leitura/.test(s))cat='Hábitos';else if(/ideia|pensar|talvez|quem sabe/.test(s))cat='Ideias';return {cat,sub}}
function parseDate(text){let s=norm(text),d=new Date(),day=d.getDay();for(let k in DAYS)if(s.includes(k)){let diff=(DAYS[k]-day+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return dateKey(d)}if(s.includes('amanha')){d.setDate(d.getDate()+1);return dateKey(d)}if(s.includes('hoje'))return dateKey(d);let m=s.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(m){let y=m[3]?Number(m[3]):d.getFullYear();if(y<100)y+=2000;return `${y}-${pad(m[2])}-${pad(m[1])}`}return ''}
function parseTime(text){let s=norm(text),m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)\b/);if(!m)m=s.match(/\b(?:as?\s*)?([01]?\d|2[0-3])\s*h(?:oras?)?\b/);if(m)return pad(Number(m[1]))+':'+pad(m[2]||'00');if(/depois\s+da\s+aula|apos\s+a\s+aula|apos\s+as\s+aulas/.test(s))return '17:30';if(/\b(cedo|manha)\b/.test(s))return '08:00';if(/\btarde\b/.test(s))return '15:00';if(/\bnoite\b/.test(s))return '19:00';return ''}
function parseReminder(text){let s=norm(text);let m=s.match(new RegExp('(?:me\\s+)?(?:lembre|avise|lembrar)\\s+(?:com\\s+)?('+NUM_PATTERN+')\\s*(minuto|minutos|min|hora|horas|h)\\s+antes'));if(!m)return 0;let n=numberFromWord(m[1]);if(!n)return 0;return /^(h|hora)/.test(m[2])?n*60:n}
function parseRecurrence(text){let s=norm(text);if(/\b(todo\s+dia|todos\s+os\s+dias|diariamente)\b/.test(s))return {type:'daily',label:'todos os dias'};let m=s.match(/\b(?:toda|todo|todas\s+as|todos\s+os)\s+(domingo|segunda|terca|quarta|quinta|sexta|sabado)s?\b/);if(m){let day=DAYS[m[1]];return {type:'weekly',day,label:'toda '+DAY_LABELS[day]}}return null}
function reminderLabel(mins){if(!mins)return '';if(mins%60===0)return (mins/60)+'h antes';return mins+' min antes'}
function relativeDue(text,created){let s=norm(text);let m=s.match(new RegExp('daqui\\s+('+NUM_PATTERN+')\\s*(minuto|minutos|min|hora|horas|h)\\b'));if(!m)return null;let n=numberFromWord(m[1]);if(!n)return null;let mins=/h|hora/.test(m[2])?n*60:n;return new Date(new Date(created||Date.now()).getTime()+mins*60000)}
function applyTime(d,time){let p=(time||'08:00').split(':').map(Number);d.setHours(p[0]||8,p[1]||0,0,0);return d}
function eventDueAt(t){let rel=relativeDue(t.text,t.created);if(rel)return rel;if(t.time){let d=t.date?new Date(t.date+'T'+t.time):new Date();if(!t.date){applyTime(d,t.time);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1)}return d}return null}
function reminderSendAt(t){let event=eventDueAt(t);if(!event)return null;let rel=relativeDue(t.text,t.created);if(rel)return rel;if(t.reminder)return new Date(event.getTime()-t.reminder*60000);return event}
function recurringOccurrences(t){if(!t.recurrence)return [];let now=Date.now(),out=[],time=t.time||'08:00',count=t.recurrence.type==='daily'?30:12;if(t.recurrence.type==='daily'){let start=t.date?new Date(t.date+'T'+time):applyTime(new Date(),time);while((start.getTime()-(t.reminder||0)*60000)<now+20000)start.setDate(start.getDate()+1);for(let i=0;i<count;i++){let ev=new Date(start);ev.setDate(start.getDate()+i);out.push(t.reminder?new Date(ev.getTime()-t.reminder*60000):ev)}}else if(t.recurrence.type==='weekly'){let d=applyTime(new Date(),time);let diff=(t.recurrence.day-d.getDay()+7)%7;d.setDate(d.getDate()+diff);while((d.getTime()-(t.reminder||0)*60000)<now+20000)d.setDate(d.getDate()+7);for(let i=0;i<count;i++){let ev=new Date(d);ev.setDate(d.getDate()+7*i);out.push(t.reminder?new Date(ev.getTime()-t.reminder*60000):ev)}}return out}
function hasReminderIntent(text){let s=norm(text);return /\b(lembre|avise|lembrar|aviso)\b/.test(s)||/daqui\s+/.test(s)}
function shouldSchedule(t){return hasReminderIntent(t.text)||!!t.recurrence}
async function getSubscriptionId(){const OneSignal=await window.oneSignalReady;if(!OneSignal)throw new Error('OneSignal não carregou.');if(!('Notification' in window))throw new Error('Este navegador não oferece notificações web.');if(Notification.permission!=='granted')throw new Error('Ative as notificações primeiro.');try{await OneSignal.User.PushSubscription.optIn()}catch(e){}for(let i=0;i<12;i++){let id=OneSignal.User&&OneSignal.User.PushSubscription&&OneSignal.User.PushSubscription.id;if(id)return id;await new Promise(r=>setTimeout(r,500))}throw new Error('Não encontrei a inscrição do OneSignal. Abra o app pela Tela Inicial e toque em Ativar notificações.')}
async function createRemoteNotification(subscriptionId,t,sendAt){let res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscriptionId,title:'Meu Planner 💛',message:t.text||'Você tem um lembrete.',sendAfter:sendAt.toISOString()})});let txt=await res.text();if(!res.ok)throw new Error(txt||('Erro '+res.status));let result={};try{result=JSON.parse(txt)}catch(e){}return {sendAt:sendAt.toISOString(),notificationId:result.id||result.notification_id||result.notificationId||'',createdAt:new Date().toISOString()}}
async function scheduleRemoteReminder(t,quiet=false){if(!shouldSchedule(t))return false;let sent=scheduledStore();if(sent[t.id])return true;let subscriptionId=await getSubscriptionId();if(t.recurrence){let dates=recurringOccurrences(t);if(!dates.length){if(!quiet)toast('Não encontrei horário para esse lembrete recorrente.');return false}let occurrences=[];for(const d of dates){try{occurrences.push(await createRemoteNotification(subscriptionId,t,d))}catch(e){if(!quiet)toast('Alguns avisos recorrentes não foram agendados.')}}if(!occurrences.length)throw new Error('Não consegui agendar os avisos recorrentes.');sent[t.id]={recurring:true,label:t.recurrence.label,occurrences,createdAt:new Date().toISOString()};saveScheduledStore(sent);return true}
  let sendAt=reminderSendAt(t);if(!sendAt)return false;if(sendAt.getTime()<Date.now()+20000){if(!quiet)toast('Esse horário já passou ou está muito em cima.');return false}sent[t.id]=await createRemoteNotification(subscriptionId,t,sendAt);saveScheduledStore(sent);return true}
async function schedulePendingReminders(quiet=true){if(schedulingNow)return;schedulingNow=true;try{for(const t of tasks){if(!t.done)await scheduleRemoteReminder(t,quiet).catch(e=>{if(!quiet)toast('Não consegui agendar: '+e.message)})}}finally{schedulingNow=false}}
async function cancelOneNotification(notificationId){if(!notificationId)return false;let res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cancel',notificationId})});let txt=await res.text();if(!res.ok)throw new Error(txt||('Erro '+res.status));return true}
async function cancelScheduledInfo(info){let obj=typeof info==='string'?{sendAt:info}:info;if(!obj)return false;if(Array.isArray(obj.occurrences)){let ok=0;for(const item of obj.occurrences){try{if(await cancelOneNotification(item.notificationId))ok++}catch(e){}}return ok>0}return cancelOneNotification(obj.notificationId)}
async function firePlannerReminder(t){if(!('Notification' in window)||Notification.permission!=='granted')return;try{const reg=await navigator.serviceWorker.ready;reg.showNotification('Meu Planner 💛',{body:t.text||'Você tem um lembrete.',icon:'./icon-192.png',badge:'./icon-192.png'})}catch(e){}}
function checkLocalReminders(){let sent=JSON.parse(localStorage.getItem('brunaNotified')||'[]');let now=Date.now();tasks.forEach(t=>{if(t.recurrence)return;let due=reminderSendAt(t);if(!due||t.done||sent.includes(t.id)||!shouldSchedule(t))return;let diff=due.getTime()-now;if(diff<=0&&diff>-300000){sent.push(t.id);firePlannerReminder(t)}});localStorage.setItem('brunaNotified',JSON.stringify(sent.slice(-200)))}
setInterval(checkLocalReminders,15000);
function addTask(){let text=document.getElementById('input').value.trim();if(!text)return toast('Escreva ou fale alguma coisa primeiro.');let c=classify(text),time=parseTime(text),reminder=parseReminder(text),recurrence=parseRecurrence(text);if(recurrence&&!time)time='08:00';let t={id:Date.now(),text,cat:c.cat,sub:c.sub,date:recurrence?'':parseDate(text),time,reminder,recurrence,done:false,created:new Date().toISOString()};tasks.unshift(t);save();document.getElementById('input').value='';let msg=`Organizado em ${c.cat}${c.sub?' › '+c.sub:''}${recurrence?' • 🔁 '+recurrence.label:''}${time?' • '+time:''}${reminder?' • aviso '+reminderLabel(reminder):''}`;toast(msg);if(shouldSchedule(t)){let first=t.recurrence?recurringOccurrences(t)[0]:reminderSendAt(t);scheduleRemoteReminder(t).then(ok=>{if(ok){toast(t.recurrence?'🔁 Lembretes recorrentes agendados.':'🔔 Lembrete agendado para '+first.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}));render()}}).catch(e=>toast('Tarefa salva, mas o aviso não foi agendado: '+e.message))}}
function save(){localStorage.setItem('brunaTasks',JSON.stringify(tasks));render()}
function taskHtml(t){let scheduled=scheduledInfo(t.id);let recurring=t.recurrence?` <span class="reminder">🔁 ${t.recurrence.label}</span>`:'';let schedLabel=scheduled?` <span class="reminder">✅ ${scheduled.recurring?'avisos agendados':'aviso agendado'}</span>`:'';return `<div class="item ${t.recurrence?'routine-item':''} ${t.done?'done':''}"><button class="check" onclick="toggle(${t.id})">${t.done?'✓':''}</button><div style="flex:1"><div>${esc(t.text)}</div><div class="meta"><span class="tag">${t.cat}</span>${t.sub?`<span class="tag">${t.sub}</span>`:''}${t.date?' 📅 '+new Date(t.date+'T12:00').toLocaleDateString('pt-BR'):''}${t.time?` <span class="time">🕐 ${esc(t.time)}</span>`:''}${t.reminder?` <span class="reminder">🔔 ${reminderLabel(t.reminder)}</span>`:''}${recurring}${schedLabel}</div></div><button class="btn secondary" style="padding:7px 9px" onclick="del(${t.id})">×</button></div>`}
function render(){let today=dateKey(new Date());document.getElementById('todayCount').textContent=tasks.filter(t=>!t.done&&t.date===today).length;document.getElementById('schoolCount').textContent=tasks.filter(t=>!t.done&&t.cat==='Escola').length;document.getElementById('tourCount').textContent=tasks.filter(t=>!t.done&&t.cat==='SGS Vinho & Café').length;document.getElementById('pendingCount').textContent=tasks.filter(t=>!t.done).length;document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="chip ${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('');let arr=tasks.filter(t=>active==='Tudo'||t.cat===active),el=document.getElementById('list');if(!arr.length){el.innerHTML='<div class="empty">Nenhuma tarefa aqui ainda 🌿</div>';return}let routines=arr.filter(t=>t.recurrence),singles=arr.filter(t=>!t.recurrence),html='';if(routines.length){html+='<h2 class="section-title">Minhas rotinas</h2><div class="small-note">Lembretes que se repetem automaticamente.</div>'+routines.map(taskHtml).join('')}if(singles.length){html+='<h2 class="section-title">Minhas tarefas</h2><div class="small-note">Tarefas pontuais e compromissos únicos.</div>'+singles.map(taskHtml).join('')}el.innerHTML=html}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toggle(id){let t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}
function del(id){let info=scheduledInfo(id);tasks=tasks.filter(x=>x.id!==id);let sent=scheduledStore();delete sent[id];saveScheduledStore(sent);save();if(info){cancelScheduledInfo(info).then(ok=>toast(ok?'🔕 Tarefa apagada e aviso cancelado.':'Tarefa apagada.')).catch(e=>toast('Tarefa apagada. Se o aviso já estava muito perto, ele ainda pode tocar.'))}else{toast('Tarefa apagada.')}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3800)}
document.getElementById('add').onclick=addTask;
document.getElementById('input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')addTask()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('voice').onclick=()=>{if(!SR)return toast('O reconhecimento de voz depende do navegador. No iPhone, você também pode usar o microfone do teclado.');let r=new SR();r.lang='pt-BR';r.onresult=e=>document.getElementById('input').value=e.results[0][0].transcript;r.onerror=()=>toast('Não consegui ouvir. Tente novamente.');r.start()};
</script>
<script>
(async function(){
  const status=document.getElementById('notifyStatus');
  const btn=document.getElementById('notifyBtn');
  function setEnabled(){if(status)status.textContent='✅ Notificações autorizadas no iPhone.';if(btn)btn.textContent='🔔 Notificações ativadas'}
  async function refreshNotificationUI(){
    if(!('Notification' in window)){if(status)status.textContent='Este modo do navegador não oferece notificações web.';if(btn)btn.disabled=true;return}
    if(Notification.permission==='granted'){setEnabled();schedulePendingReminders(true);return}
    if(Notification.permission==='denied'){if(status)status.textContent='⚠️ As notificações estão bloqueadas. Será preciso liberá-las nos Ajustes do iPhone.';return}
    if(status)status.textContent='Toque em “Ativar notificações” e permita os avisos.';
  }
  if(btn){btn.addEventListener('click',async()=>{
    if(!('Notification' in window))return refreshNotificationUI();
    try{
      const OneSignal=await window.oneSignalReady;
      if(OneSignal){await OneSignal.Notifications.requestPermission();try{await OneSignal.User.PushSubscription.optIn()}catch(e){}}
      await refreshNotificationUI();
      if(Notification.permission==='granted'){
        try{const reg=await navigator.serviceWorker.ready;reg.showNotification('Meu Planner 💛',{body:'Notificações ativadas. Este é um aviso de teste.',icon:'./icon-192.png',badge:'./icon-192.png'})}catch(e){}
        schedulePendingReminders(false);
      }
    }catch(e){if(status)status.textContent='Erro: '+e.message}
  })}
  await refreshNotificationUI();
  render();
})();
</script>
</body>
