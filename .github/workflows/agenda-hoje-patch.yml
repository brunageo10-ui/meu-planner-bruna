name: Patch Agenda Hoje
on:
  push:
    paths:
      - .github/workflows/agenda-hoje-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar agenda de hoje
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Meu Planner — Bruna V10.1','Meu Planner — Bruna V10.2')
          s=s.replace('Versão 10.1 • Ferramentas recolhidas no final.','Versão 10.2 • Agenda de hoje no topo.')
          s=s.replace('version:'+chr(39)+'10.1'+chr(39),'version:'+chr(39)+'10.2'+chr(39))
          if 'todayPanel' not in s:
              css=r'''
.todayPanel{background:linear-gradient(145deg,#fffdfb,#fff8f2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow2);padding:12px;margin:10px 0 12px}.todayHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.todayHead strong{font-size:17px;color:var(--wine2)}.todayHead small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:650}.todayHead>span{font-size:22px}.todayMini{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-top:7px}.todayMiniTime{font-weight:900;color:var(--wine);font-size:13px;min-width:48px}.todayMiniText{font-size:13px;line-height:1.2;font-weight:750}.todayMiniCat{font-size:11px;color:var(--muted);margin-top:2px}.todayEmpty{font-size:13px;color:var(--muted);background:rgba(255,255,255,.78);border:1px dashed var(--line);border-radius:14px;padding:11px;text-align:center}
'''
              html=r'''  <section class='todayPanel' id='todayPanel'>
    <div class='todayHead'><div><strong>Agenda de hoje</strong><small id='todayDateLabel'>Carregando...</small></div><span>☀️</span></div>
    <div id='todayAgendaList'><div class='todayEmpty'>Carregando agenda...</div></div>
  </section>
'''
              js=r'''
function agendaDateLabel(){let d=new Date();return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}
function todayAt(time){let d=new Date(),p=String(time||'23:59').split(':').map(Number);d.setHours(p[0]||0,p[1]||0,0,0);return d}
function routineOccursToday(t){let r=t.recurrence;if(!r)return false;let d=new Date();if(r.type==='daily')return true;if(r.type==='weekly')return d.getDay()===r.day;if(r.type==='monthly')return d.getDate()===Math.min(r.day||1,daysInMonth(d.getFullYear(),d.getMonth()));if(r.type==='interval'){let base=new Date(t.created||Date.now()),cur=new Date();base.setHours(0,0,0,0);cur.setHours(0,0,0,0);let diff=Math.round((cur-base)/86400000);return diff>=0&&diff%(r.days||1)===0}return false}
function todayAgendaItems(){let today=dateKey(new Date()),list=[];tasks.forEach(t=>{if(!isActive(t))return;if(isRoutine(t)){if(routineOccursToday(t)){let time=t.time||'08:00';list.push({text:t.text,time,cat:t.cat,routine:true,stamp:todayAt(time).getTime()})}return}let ev=eventDueAt(t);if(t.date===today||(ev&&dateKey(ev)===today)){let time=t.time||(ev?pad(ev.getHours())+':'+pad(ev.getMinutes()):'Hoje');list.push({text:t.text,time,cat:t.cat,routine:false,stamp:ev?ev.getTime():todayAt('23:59').getTime()})}});return list.sort((a,b)=>a.stamp-b.stamp).slice(0,6)}
function renderTodayAgenda(){let list=document.getElementById('todayAgendaList'),label=document.getElementById('todayDateLabel');if(!list)return;if(label)label.textContent=agendaDateLabel();let items=todayAgendaItems();if(!items.length){list.innerHTML=`<div class='todayEmpty'>Nada marcado para hoje. Ótimo respiro 🌿</div>`;return}list.innerHTML=items.map(x=>`<div class='todayMini'><span class='todayMiniTime'>${esc(x.time)}</span><div><div class='todayMiniText'>${esc(x.text)}</div><div class='todayMiniCat'>${x.routine?'Rotina • ':''}${esc(catLabel(x.cat))}</div></div></div>`).join('')}
'''
              s=s.replace('\n</style>','\n'+css+'\n</style>',1)
              marker='  </section>\n'
              pos=s.find(marker)
              if pos!=-1:
                  pos=pos+len(marker)
                  s=s[:pos]+html+s[pos:]
              s=s.replace('function render(){',js+'\nfunction render(){',1)
              old=r'''renderList('doneList',filtered(tasks.filter(t=>!isRoutine(t)&&t.done)),false,true)}'''
              new=r'''renderList('doneList',filtered(tasks.filter(t=>!isRoutine(t)&&t.done)),false,true);renderTodayAgenda()}'''
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/agenda-hoje-patch.yml').unlink(missing_ok=True)
          PY
          git config user.name github-actions[bot]
          git config user.email actions@github.com
          git add index.html .github/workflows/agenda-hoje-patch.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Versão 10.2: agenda de hoje'
            git push
          fi
