name: Patch Agenda Hoje
on:
  push:
    paths:
      - .github/workflows/agenda-hoje-patch.yml
      - .github/scripts/patch_agenda.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/patch_agenda.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email actions@github.com
          rm -f .github/workflows/agenda-hoje-patch.yml .github/scripts/patch_agenda.py
          git add index.html .github/workflows/agenda-hoje-patch.yml .github/scripts/patch_agenda.py
          if ! git diff --cached --quiet; then
            git commit -m 'Versão 10.2: agenda de hoje'
            git push
          fi
